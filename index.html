<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebirds Scoreboard</title>
<style>
  :root {
    --teal: #0a7d7a;       /* firebirds background gradient */
    --accent: #1ff0e4;     /* bright teal for text/accents (high contrast on black) */
    --red: #ff2a44;        /* brightened red */
    --black: #000;         /* pure black for max contrast */
    --dim: #e2e5e9;        /* "secondary" text — still bright enough to read from the sofa */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--black);
    color: #fff;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: none;
    -webkit-user-select: none; user-select: none;
  }
  /* 7" Pi displays are commonly 800x480 */
  #board { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  #status { text-align: center; padding: 6px; font-size: 7vh; font-weight: 700;
            color: #fff; text-transform: uppercase; letter-spacing: 2px; line-height: 1.05; }
  #teams { flex: 1; display: flex; }
  .side { flex: 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 1vh; min-width: 0; }
  .side.firebirds { background: linear-gradient(135deg, var(--teal), #063f3e); }
  .side .tlogo { height: 16vh; width: auto; max-width: 42vw; object-fit: contain; }
  .side .name { font-size: 4.2vh; font-weight: 600; color: var(--dim);
                text-align: center; padding: 0 1vw; line-height: 1.05; }
  .side.firebirds .name { color: #fff; }
  .side .goals { font-size: 40vh; font-weight: 900; line-height: 1; color: #fff; }
  .divider { width: 3px; background: #333; }
  #scheduled, #idle { display: none; flex: 1; flex-direction: column;
                      align-items: center; justify-content: center; gap: 2vh; text-align: center;
                      padding: 0 3vw; }
  #scheduled .vs { font-size: 6vh; font-weight: 700; color: #fff;
                   text-transform: uppercase; letter-spacing: 3px; }
  #scheduled .matchup { display: flex; align-items: center; justify-content: center; gap: 4vw; }
  #scheduled .matchup img { height: 26vh; width: auto; object-fit: contain; }
  #scheduled .matchup .x { font-size: 8vh; font-weight: 800; color: var(--dim); }
  #scheduled .opp { font-size: 11vh; font-weight: 900; line-height: 1.0; color: #fff; }
  #scheduled .when { font-size: 8vh; font-weight: 800; color: var(--accent); }
  #idle .logo-img { height: 40vh; width: auto; object-fit: contain; }
  #idle .label { font-size: 6vh; font-weight: 700; color: var(--dim); }
  /* Goal celebration overlay */
  #goal {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    font-size: 22vh; font-weight: 900; letter-spacing: 1vh;
    background: var(--teal);
    animation: flash .4s steps(1) infinite;
  }
  #goal.show { display: flex; }
  @keyframes flash {
    0% { background: var(--teal); }
    50% { background: var(--red); }
  }
</style>
</head>
<body>
  <div id="board">
    <div id="status">Loading…</div>
    <div id="teams">
      <div class="side" id="away">
        <img class="tlogo" alt="" onerror="this.style.display='none'"><div class="name"></div><div class="goals">0</div>
      </div>
      <div class="divider"></div>
      <div class="side" id="home">
        <img class="tlogo" alt="" onerror="this.style.display='none'"><div class="name"></div><div class="goals">0</div>
      </div>
    </div>
    <div id="scheduled">
      <div class="vs">Next game</div>
      <div class="matchup">
        <img id="s-fb" alt="" onerror="this.style.display='none'">
        <span class="x" id="s-x">vs</span>
        <img id="s-opp" alt="" onerror="this.style.display='none'">
      </div>
      <div class="opp"></div>
      <div class="when"></div>
    </div>
    <div id="idle"><img class="logo-img" id="idle-logo" alt="" onerror="this.style.display='none'"><div class="label">No upcoming game</div></div>
  </div>
  <div id="goal">GOAL!</div>

<script>
const POLL_MS = 15000;
const FB_LOGO = "https://assets.leaguestat.com/ahl/logos/445.png"; // Firebirds, for the idle screen
let lastGoals = null;      // previous Firebirds goal count
let seenFirst = false;     // don't celebrate on initial load

const $ = sel => document.querySelector(sel);

function setLogo(el, url) {       // re-show in case a prior load errored out
  el.style.display = "";
  el.src = url || "";
}

function setSide(el, team, isFirebirds) {
  el.classList.toggle("firebirds", isFirebirds);
  setLogo(el.querySelector("img.tlogo"), team.logo);
  el.querySelector(".name").textContent = team.name;
  el.querySelector(".goals").textContent = team.goals;
}

function show(which) {
  $("#teams").style.display = which === "game" ? "flex" : "none";
  $("#scheduled").style.display = which === "scheduled" ? "flex" : "none";
  $("#idle").style.display = which === "idle" ? "flex" : "none";
}

function celebrate() {
  const g = $("#goal");
  g.classList.add("show");
  setTimeout(() => g.classList.remove("show"), 5000);
}

function render(d) {
  if (d.state === "live" || d.state === "final") {
    show("game");
    // visitor on the left, home on the right
    setSide($("#away"), d.visitor, d.firebirds === "visitor");
    setSide($("#home"), d.home, d.firebirds === "home");
    $("#status").textContent =
      d.state === "final" ? "Final"
      : `${d.period || ""} ${d.clock || ""}`.trim();

    if (seenFirst && lastGoals !== null && d.firebirdsGoals > lastGoals) celebrate();
    lastGoals = d.firebirdsGoals;
    seenFirst = true;
  } else if (d.state === "scheduled") {
    show("scheduled");
    $("#status").textContent = "Coachella Valley Firebirds";
    setLogo($("#s-fb"), d.firebirds === "home" ? d.home.logo : d.visitor.logo);
    setLogo($("#s-opp"), d.firebirds === "home" ? d.visitor.logo : d.home.logo);
    $("#s-x").textContent = d.atHome ? "vs" : "@";
    $("#scheduled .opp").textContent = (d.atHome ? "vs " : "@ ") + d.opponent;
    $("#scheduled .when").textContent = `${d.gameDate} · ${d.startTime}`;
    lastGoals = null; seenFirst = false;
  } else {
    show("idle");
    $("#status").textContent = "Coachella Valley Firebirds";
    setLogo($("#idle-logo"), FB_LOGO);
    lastGoals = null; seenFirst = false;
  }
}

async function tick() {
  try {
    const r = await fetch("/score");
    if (r.ok) render(await r.json());
    else $("#status").textContent = "Feed unavailable";
  } catch {
    $("#status").textContent = "Offline — retrying";
  }
}

tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
